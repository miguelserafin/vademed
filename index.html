<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vade Med — Notícias e Artigos Médicos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EDE9DD;
    --card:#F8F5EB;
    --ink:#1B2420;
    --ink-soft:#4A5650;
    --teal:#2F6F5E;
    --teal-dark:#20493D;
    --amber:#B8863B;
    --rule:#C7C0AA;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .masthead{
    border-bottom:2px solid var(--ink);
    padding:28px 5vw 18px;
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    flex-wrap:wrap;
    gap:12px;
  }
  .masthead h1{
    font-family:'Newsreader', serif;
    font-weight:600;
    font-size:clamp(2.2rem, 5vw, 3.4rem);
    margin:0;
    letter-spacing:-0.01em;
  }
  .masthead h1 em{ font-style:italic; color:var(--teal); }
  .masthead .meta{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.75rem;
    color:var(--ink-soft);
    text-align:right;
    line-height:1.5;
    text-transform:uppercase;
    letter-spacing:0.06em;
  }
  .tabs{ display:flex; gap:0; padding:0 5vw; margin-top:14px; }
  .tab-btn{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.8rem;
    letter-spacing:0.08em;
    text-transform:uppercase;
    background:var(--rule);
    color:var(--ink-soft);
    border:none;
    padding:11px 26px 9px;
    cursor:pointer;
    clip-path:polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
    margin-right:-8px;
    transition:background .15s, color .15s;
  }
  .tab-btn.active{ background:var(--card); color:var(--ink); font-weight:600; box-shadow: 0 -2px 0 var(--teal) inset; }
  .tab-btn:hover:not(.active){ background:#D8D2BE; }
  main{ background:var(--card); min-height:60vh; padding:34px 5vw 60px; border-top:2px solid var(--ink); }
  .panel{ display:none; }
  .panel.active{ display:block; animation:fade .25s ease; }
  @keyframes fade{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }

  .news-list{ list-style:none; margin:0; padding:0; max-width:920px; }
  .news-item{ display:grid; grid-template-columns:70px 1fr; gap:22px; padding:20px 0; border-bottom:1px solid var(--rule); }
  .news-item:first-child{ padding-top:0; }
  .news-time{ font-family:'IBM Plex Mono', monospace; font-size:0.78rem; color:var(--teal-dark); padding-top:4px; }
  .news-tag{
    display:inline-block; font-family:'IBM Plex Mono', monospace; font-size:0.65rem;
    letter-spacing:0.07em; text-transform:uppercase; background:var(--amber); color:#fff;
    padding:2px 8px; border-radius:2px; margin-bottom:8px;
  }
  .news-item h3{ font-family:'Newsreader', serif; font-weight:500; font-size:1.35rem; margin:0 0 6px; line-height:1.25; }
  .news-item p{ margin:0; color:var(--ink-soft); font-size:0.95rem; line-height:1.55; max-width:66ch; }
  .news-why{ margin-top:8px !important; font-family:'IBM Plex Mono', monospace; font-size:0.75rem !important; color:var(--teal-dark) !important; }

  .search-row{ display:flex; gap:10px; max-width:720px; margin-bottom:16px; flex-wrap:wrap; }
  #search-input{
    flex:1; min-width:220px; font-family:'IBM Plex Sans', sans-serif; font-size:1rem;
    padding:12px 16px; border:1.5px solid var(--ink); background:var(--paper); color:var(--ink); border-radius:2px;
  }
  #search-input:focus{ outline:2px solid var(--teal); outline-offset:1px; }
  .chips{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:26px; }
  .chip{
    font-family:'IBM Plex Mono', monospace; font-size:0.72rem; letter-spacing:0.04em; text-transform:uppercase;
    padding:6px 12px; border:1px solid var(--ink-soft); background:transparent; color:var(--ink-soft);
    border-radius:999px; cursor:pointer; transition:all .15s;
  }
  .chip.active, .chip:hover{ background:var(--teal); color:#fff; border-color:var(--teal); }
  .result-count{ font-family:'IBM Plex Mono', monospace; font-size:0.75rem; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:14px; }
  .card-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:22px; }
  .article-card{ background:var(--paper); border:1px solid var(--ink); padding:18px 18px 16px; position:relative; display:flex; flex-direction:column; gap:10px; }
  .punch-row{ display:flex; gap:5px; position:absolute; top:8px; right:10px; }
  .punch-row span{ width:5px; height:5px; border-radius:50%; background:var(--rule); }
  .article-eyebrow{ font-family:'IBM Plex Mono', monospace; font-size:0.65rem; letter-spacing:0.08em; text-transform:uppercase; color:var(--teal-dark); }
  .article-card h4{ font-family:'Newsreader', serif; font-weight:600; font-size:1.15rem; margin:0; line-height:1.3; }
  .article-meta{ font-family:'IBM Plex Mono', monospace; font-size:0.7rem; color:var(--ink-soft); }
  .article-abstract{ font-size:0.88rem; color:var(--ink-soft); line-height:1.5; margin:0; }
  .article-takeaway{ font-family:'IBM Plex Mono', monospace; font-size:0.75rem; color:var(--teal-dark); line-height:1.5; margin:0; padding-top:8px; border-top:1px dashed var(--rule); }
  .article-card a.read-link{
    font-family:'IBM Plex Mono', monospace; font-size:0.72rem; text-transform:uppercase; letter-spacing:0.05em;
    color:var(--teal); text-decoration:none; border-top:1px solid var(--rule); padding-top:10px; margin-top:auto;
  }
  .article-card a.read-link:hover{ text-decoration:underline; }
  .empty-state{ font-family:'IBM Plex Mono', monospace; color:var(--ink-soft); font-size:0.9rem; padding:40px 0; }
  footer{ padding:16px 5vw; font-family:'IBM Plex Mono', monospace; font-size:0.68rem; color:var(--ink-soft); text-align:center; background:var(--paper); }

  @media (max-width:560px){
    .masthead{ flex-direction:column; align-items:flex-start; }
    .masthead .meta{ text-align:left; }
    .news-item{ grid-template-columns:1fr; gap:6px; }
  }
</style>
</head>
<body>

<header class="masthead">
  <h1>Va<em>de</em> Med</h1>
  <div class="meta">Edição diária · Para estudantes de medicina &amp; médicos em atualização</div>
</header>

<nav class="tabs">
  <button class="tab-btn active" data-panel="news">Notícias do dia</button>
  <button class="tab-btn" data-panel="articles">Busca de artigos</button>
</nav>

<main>
  <section id="news" class="panel active">
    <ul class="news-list" id="news-list"></ul>
  </section>

  <section id="articles" class="panel">
    <div class="search-row">
      <input type="text" id="search-input" placeholder="Buscar por especialidade ou tema, ex: bariátrica...">
    </div>
    <div class="chips" id="chip-row"></div>
    <div class="result-count" id="result-count"></div>
    <div class="card-grid" id="card-grid"></div>
  </section>
</main>

<footer>Conteúdo de exemplo para demonstração da interface — não representa notícias ou publicações reais.</footer>

<script>
const news = [
  {time:"07:12", tag:"Cardiologia", title:"Novo protocolo de reabilitação cardíaca reduz tempo de internação", body:"Hospitais que adotaram o protocolo relatam recuperação mais rápida em pacientes pós-infarto.", why:"Relevante para rotina de UTI e enfermarias de pós-operatório."},
  {time:"08:45", tag:"Saúde pública", title:"Campanha de vacinação de inverno é ampliada em capitais", body:"Secretarias de saúde estendem o horário de funcionamento das unidades básicas.", why:"Impacta orientação a pacientes na atenção primária."},
  {time:"09:30", tag:"Oncologia", title:"Estudo multicêntrico avalia nova combinação terapêutica", body:"Pesquisadores comparam resposta ao tratamento combinado frente ao protocolo padrão.", why:"Pode mudar critério de escolha terapêutica em breve."},
  {time:"10:15", tag:"Cirurgia", title:"Técnicas minimamente invasivas ganham espaço em centros cirúrgicos", body:"Equipes relatam menor tempo de recuperação com abordagens laparoscópicas e robóticas.", why:"Bom tema para revisão de curva de aprendizado em residência."},
  {time:"11:50", tag:"Endocrinologia", title:"Sociedade médica revisa diretrizes sobre manejo do diabetes tipo 2", body:"Atualização traz recomendações sobre acompanhamento nutricional.", why:"Diretriz nova costuma cair em prova e muda conduta ambulatorial."},
  {time:"13:20", tag:"Neurologia", title:"Novo exame de imagem auxilia diagnóstico precoce", body:"Ferramenta testada em rede de clínicas para identificar alterações antes de sintomas.", why:"Pode antecipar encaminhamento em casos de suspeita clínica."},
  {time:"15:05", tag:"Pediatria", title:"Consultas de rotina infantil têm alta procura no início do ano letivo", body:"Pediatras recomendam agendamento antecipado para exames e vacinação.", why:"Bom lembrete para orientar famílias na consulta de rotina."},
];

const articles = [
  {topic:"bariátrica", title:"Comparação entre técnicas de bypass gástrico e sleeve em médio prazo", journal:"Rev. Bras. Cir. Metabólica", year:"2025", authors:"Almeida, R. et al.", abstract:"Análise retrospectiva compara desfechos de perda de peso e complicações entre duas técnicas em cinco anos.", takeaway:"Ajuda a comparar risco e resultado das duas técnicas."},
  {topic:"bariátrica", title:"Manejo nutricional pós-operatório em cirurgia bariátrica", journal:"J. Nutrição Clínica", year:"2024", authors:"Ferreira, T.; Souza, M.", abstract:"Revisão sobre protocolos de suplementação no primeiro ano após procedimentos bariátricos.", takeaway:"Bom material de apoio para orientação nutricional."},
  {topic:"cardiologia", title:"Reabilitação cardíaca supervisionada: revisão sistemática", journal:"Cadernos de Cardiologia", year:"2025", authors:"Lima, P.", abstract:"Síntese de estudos sobre reabilitação supervisionada e taxa de reinternação.", takeaway:"Reforça o valor de encaminhar para reabilitação supervisionada."},
  {topic:"cardiologia", title:"Uso de biomarcadores no acompanhamento pós-infarto", journal:"Rev. Cardiovascular Brasileira", year:"2024", authors:"Martins, A.; Rocha, V.", abstract:"Avaliação de marcadores sanguíneos no monitoramento pós evento coronariano.", takeaway:"Ajuda a decidir quando repetir exames no seguimento."},
  {topic:"oncologia", title:"Terapias combinadas em tumores sólidos: panorama atual", journal:"Rev. Oncologia Clínica", year:"2025", authors:"Barros, C. et al.", abstract:"Panorama sobre abordagens combinadas e critérios de seleção de pacientes.", takeaway:"Bom resumo para revisar critérios de indicação."},
  {topic:"neurologia", title:"Neuroimagem no diagnóstico precoce de doenças neurodegenerativas", journal:"Arq. Neuropsiquiatria", year:"2026", authors:"Dias, F. et al.", abstract:"Técnicas de imagem aplicadas à detecção de alterações estruturais precoces.", takeaway:"Útil para saber quando pedir exame de imagem."},
  {topic:"endocrinologia", title:"Estratégias combinadas no manejo do diabetes tipo 2", journal:"Rev. Endocrinologia Prática", year:"2025", authors:"Pereira, J.", abstract:"Revisão de estratégias farmacológicas e comportamentais combinadas.", takeaway:"Boa revisão para consulta rápida de conduta ambulatorial."},
  {topic:"pediatria", title:"Cobertura vacinal infantil em contextos urbanos", journal:"J. Pediatria Brasileira", year:"2024", authors:"Cardoso, N.; Teixeira, R.", abstract:"Levantamento sobre fatores associados à adesão ao calendário vacinal.", takeaway:"Ajuda a identificar barreiras comuns à adesão vacinal."},
];

const newsList = document.getElementById('news-list');
news.forEach(n=>{
  const li = document.createElement('li');
  li.className = 'news-item';
  li.innerHTML = `
    <div class="news-time">${n.time}</div>
    <div>
      <span class="news-tag">${n.tag}</span>
      <h3>${n.title}</h3>
      <p>${n.body}</p>
      <p class="news-why">Por que importa: ${n.why}</p>
    </div>`;
  newsList.appendChild(li);
});

const topics = [...new Set(articles.map(a=>a.topic))];
const chipRow = document.getElementById('chip-row');
let activeTopic = null;

function makeChip(label, value){
  const btn = document.createElement('button');
  btn.className = 'chip';
  btn.textContent = label;
  btn.addEventListener('click', ()=>{
    activeTopic = (activeTopic === value) ? null : value;
    document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
    if(activeTopic) btn.classList.add('active');
    renderArticles();
  });
  return btn;
}
chipRow.appendChild(makeChip('Todas as especialidades', null));
topics.forEach(t=> chipRow.appendChild(makeChip(t.charAt(0).toUpperCase()+t.slice(1), t)) );

const cardGrid = document.getElementById('card-grid');
const resultCount = document.getElementById('result-count');
const searchInput = document.getElementById('search-input');

function renderArticles(){
  const q = searchInput.value.trim().toLowerCase();
  const filtered = articles.filter(a=>{
    const matchesTopic = activeTopic ? a.topic === activeTopic : true;
    const haystack = (a.title+' '+a.topic+' '+a.abstract+' '+a.authors).toLowerCase();
    const matchesQuery = q ? haystack.includes(q) : true;
    return matchesTopic && matchesQuery;
  });

  resultCount.textContent = filtered.length + (filtered.length===1 ? ' artigo encontrado' : ' artigos encontrados');
  cardGrid.innerHTML = '';

  if(filtered.length === 0){
    cardGrid.innerHTML = '<div class="empty-state">Nenhum artigo corresponde à busca. Tente outro termo ou tema.</div>';
    return;
  }

  filtered.forEach(a=>{
    const card = document.createElement('div');
    card.className = 'article-card';
    card.innerHTML = `
      <div class="punch-row"><span></span><span></span><span></span></div>
      <div class="article-eyebrow">${a.topic}</div>
      <h4>${a.title}</h4>
      <div class="article-meta">${a.authors} · ${a.journal}, ${a.year}</div>
      <p class="article-abstract">${a.abstract}</p>
      <p class="article-takeaway">Principal achado: ${a.takeaway}</p>
      <a href="#" class="read-link" onclick="return false;">Ler artigo →</a>
    `;
    cardGrid.appendChild(card);
  });
}
searchInput.addEventListener('input', renderArticles);
renderArticles();

document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.panel).classList.add('active');
  });
});
</script>
</body>
</html>
